name: MONARCH PostgreSQL overlay validation
on:
  pull_request:
  push:
    branches:
      - feature/postgresql-central-provider-2026-11-27
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract cumulative source and apply PostgreSQL overlay
        shell: pwsh
        run: |
          python -c "import zipfile; zipfile.ZipFile('monarch-erp-net461-build-compatibility-repairs-2026-11-26.zip').extractall('work')"
          python -c "import shutil; shutil.copytree('postgresql-overlay/monarch_erp_mvp', 'work/monarch_erp_mvp', dirs_exist_ok=True)"
      - name: Repair legacy C# message literals before Windows build
        shell: pwsh
        run: ./work/monarch_erp_mvp/scripts/patch-windows-source-strings.ps1 -Root ./work/monarch_erp_mvp
      - name: Install Python dependencies
        working-directory: work/monarch_erp_mvp
        run: python -m pip install -r tools/requirements.txt pytest
      - name: Run Python regression suite
        working-directory: work/monarch_erp_mvp
        run: python -m pytest -q
      - name: Restore and build complete Windows solution
        working-directory: work/monarch_erp_mvp
        run: |
          dotnet restore MonarchERP.sln
          dotnet build MonarchERP.sln --configuration Release --no-restore
      - name: Assess isolated WPF .NET 8 Windows compatibility
        working-directory: work/monarch_erp_mvp
        run: dotnet build src/Monarch.Desktop/Monarch.Desktop.Net8.Compatibility.csproj --configuration Release
      - name: Publish isolated WPF .NET 8 win-x64 compatibility package
        working-directory: work/monarch_erp_mvp
        run: dotnet publish src/Monarch.Desktop/Monarch.Desktop.Net8.Compatibility.csproj --configuration Release --runtime win-x64 --self-contained false --output ../desktop-net8-compat
      - name: Verify isolated WPF package contents
        shell: pwsh
        run: |
          $out = 'work/desktop-net8-compat'
          $required = @('Monarch.Desktop.Net8.Compatibility.exe','Monarch.Desktop.Net8.Compatibility.dll','Monarch.Desktop.Net8.Compatibility.deps.json','Monarch.Desktop.Net8.Compatibility.runtimeconfig.json','Monarch.Core.dll','Newtonsoft.Json.dll','Microsoft.Data.Sqlite.dll')
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path $out $name))) { throw "Missing expected .NET 8 desktop publish output: $name" }
          }
          if (Test-Path (Join-Path $out 'Monarch.PostgreSql.dll')) { throw 'The compatibility package must not accidentally include the PostgreSQL server provider.' }
          $runtime = Get-Content (Join-Path $out 'Monarch.Desktop.Net8.Compatibility.runtimeconfig.json') -Raw | ConvertFrom-Json
          $frameworks = @($runtime.runtimeOptions.frameworks | ForEach-Object { $_.name })
          if ($frameworks -notcontains 'Microsoft.WindowsDesktop.App') { throw 'The framework-dependent WPF package must declare Microsoft.WindowsDesktop.App.' }
      - name: Upload experimental WPF .NET 8 win-x64 package
        uses: actions/upload-artifact@v4
        with:
          name: MONARCH-WPF-NET8-WIN-X64-COMPATIBILITY-EXPERIMENT
          path: work/desktop-net8-compat/**
          if-no-files-found: error
          retention-days: 14
      - name: Run existing .NET smoke tests
        working-directory: work/monarch_erp_mvp
        run: dotnet run --project tests/Monarch.Core.SmokeTests/Monarch.Core.SmokeTests.csproj --configuration Release
      - name: Run central desktop GL HTTP adapter contract tests
        working-directory: work/monarch_erp_mvp
        run: dotnet run --project tests/Monarch.Desktop.Http.Tests/Monarch.Desktop.Http.Tests.csproj --configuration Release
      - name: Remove build caches from cumulative source bundle
        shell: pwsh
        run: |
          $root = (Resolve-Path 'work/monarch_erp_mvp').Path
          Get-ChildItem -LiteralPath $root -Directory -Recurse -Force |
            Where-Object { $_.Name -in @('bin','obj','.git','.vs','__pycache__','.pytest_cache') } |
            Sort-Object { $_.FullName.Length } -Descending |
            Remove-Item -Recurse -Force
          Get-ChildItem -LiteralPath $root -File -Recurse -Force -Filter '*.pyc' |
            Remove-Item -Force
      - name: Create cumulative source archive including hidden files
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root = (Resolve-Path 'work/monarch_erp_mvp').Path
          $zipPath = Join-Path (Get-Location).Path 'MONARCH-ERP-CUMULATIVE-POSTGRESQL-2026-11-27.zip'
          if (Test-Path $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          $archive = [System.IO.Compression.ZipFile]::Open($zipPath, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            Get-ChildItem -LiteralPath $root -File -Recurse -Force | ForEach-Object {
              $relative = $_.FullName.Substring($root.Length).TrimStart([char[]]@('\','/'))
              $entryName = 'monarch_erp_mvp/' + $relative.Replace('\','/')
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $archive, $_.FullName, $entryName, [System.IO.Compression.CompressionLevel]::Optimal
              ) | Out-Null
            }
          }
          finally { $archive.Dispose() }
      - name: Verify cumulative archive boundaries
        shell: pwsh
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('MONARCH-ERP-CUMULATIVE-POSTGRESQL-2026-11-27.zip'); n=z.namelist(); assert 'monarch_erp_mvp/.github/workflows/windows-build.yml' in n; assert not any('/bin/' in p or '/obj/' in p or p.endswith('.pyc') for p in n); assert z.testzip() is None"

      - uses: actions/upload-artifact@v4
        with:
          name: MONARCH-ERP-CUMULATIVE-POSTGRESQL
          path: MONARCH-ERP-CUMULATIVE-POSTGRESQL-2026-11-27.zip
          if-no-files-found: error
          retention-days: 30
  postgresql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monarch_admin
          POSTGRES_PASSWORD: monarch-admin-ci-password
          POSTGRES_DB: monarch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monarch_admin -d monarch_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONARCH_POSTGRESQL_CONNECTION: Host=localhost;Port=5432;Database=monarch_ci;Username=monarch_admin;Password=monarch-admin-ci-password;Pooling=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Extract cumulative source and apply PostgreSQL overlay
        run: |
          python3 -c "import zipfile; zipfile.ZipFile('monarch-erp-net461-build-compatibility-repairs-2026-11-26.zip').extractall('work')"
          python3 -c "import shutil; shutil.copytree('postgresql-overlay/monarch_erp_mvp', 'work/monarch_erp_mvp', dirs_exist_ok=True)"
      - name: Apply shared desktop and Core dependency patch
        working-directory: work/monarch_erp_mvp
        run: python3 scripts/apply-desktop-navigation.py .
      - name: Restore PostgreSQL integration tests
        working-directory: work/monarch_erp_mvp
        run: dotnet restore tests/Monarch.PostgreSql.IntegrationTests/Monarch.PostgreSql.IntegrationTests.csproj
      - name: Build PostgreSQL integration tests
        working-directory: work/monarch_erp_mvp
        run: dotnet build tests/Monarch.PostgreSql.IntegrationTests/Monarch.PostgreSql.IntegrationTests.csproj --configuration Release --no-restore
      - name: Run PostgreSQL RLS and outbox integration tests
        working-directory: work/monarch_erp_mvp
        run: dotnet run --project tests/Monarch.PostgreSql.IntegrationTests/Monarch.PostgreSql.IntegrationTests.csproj --configuration Release --no-build
