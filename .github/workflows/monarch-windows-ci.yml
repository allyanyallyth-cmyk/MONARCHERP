name: MONARCH Windows Build and Tests

on:
  push:
    branches:
      - main
      - chatgpt-connection-test-20261125
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-ci:
    name: Windows, .NET and Python validation
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate workflow YAML syntax
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python -c "import yaml; yaml.safe_load(open('.github/workflows/monarch-windows-ci.yml', encoding='utf-8')); print('Workflow YAML syntax OK')"

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          python --version
          python -m pip --version

      - name: Validate ZIP archives
        id: archives
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archives = @(Get-ChildItem -Path . -Recurse -File -Filter *.zip)
          if ($archives.Count -eq 0) {
            throw "No MONARCH source archive was found in the repository."
          }

          foreach ($archive in $archives) {
            Write-Host "Checking archive: $($archive.FullName)"
            $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
            try {
              foreach ($entry in $zip.Entries) {
                if ($entry.Length -gt 0) {
                  $stream = $entry.Open()
                  try { $stream.CopyTo([System.IO.Stream]::Null) }
                  finally { $stream.Dispose() }
                }
              }
            }
            finally { $zip.Dispose() }
            Write-Host "Archive integrity OK: $($archive.Name)"
          }

          $sourceArchive = Get-Item ".\monarch-erp-net461-build-compatibility-repairs-2026-11-26.zip" -ErrorAction Stop
          "source_archive=$($sourceArchive.FullName)" >> $env:GITHUB_OUTPUT

      - name: Extract cumulative source archive
        id: source
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "monarch-source"
          if (Test-Path $destination) { Remove-Item $destination -Recurse -Force }
          New-Item -ItemType Directory -Path $destination | Out-Null
          Expand-Archive -LiteralPath "${{ steps.archives.outputs.source_archive }}" -DestinationPath $destination -Force

          $root = Join-Path $destination "monarch_erp_mvp"
          if (-not (Test-Path (Join-Path $root "MonarchERP.sln"))) {
            throw "Expected MonarchERP.sln was not found after extraction."
          }

          $required = @(
            "src\Monarch.Core\Monarch.Core.csproj",
            "src\Monarch.Desktop\Monarch.Desktop.csproj",
            "src\Monarch.Api\Monarch.Api.csproj",
            "src\Monarch.Recovery\Monarch.Recovery.csproj",
            "tests\Monarch.Core.SmokeTests\Monarch.Core.SmokeTests.csproj"
          )
          foreach ($relative in $required) {
            $candidate = Join-Path $root $relative
            if (-not (Test-Path $candidate)) { throw "Required project missing: $relative" }
            Write-Host "SOURCE OK: $relative"
          }

          $projects = @(Get-ChildItem -Path $root -Recurse -File -Filter *.csproj)
          Write-Host "Extracted C# project count: $($projects.Count)"
          "source_root=$root" >> $env:GITHUB_OUTPUT

      - name: Apply deterministic Windows restore and SQLite test repairs
        shell: pwsh
        run: |
          $root = "${{ steps.source.outputs.source_root }}"
          $diag = Join-Path $env:RUNNER_TEMP "monarch-diagnostics"
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          python .github/scripts/apply_monarch_windows_repairs.py $root 2>&1 | Tee-Object -FilePath (Join-Path $diag "repair-script.log")
          if ($LASTEXITCODE -ne 0) { throw "Windows repair overlay failed." }

      - name: Restore and build complete solution
        shell: pwsh
        run: |
          $solution = Join-Path "${{ steps.source.outputs.source_root }}" "MonarchERP.sln"
          dotnet restore $solution
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed." }
          dotnet build $solution --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed." }

      - name: Validate smoke-test VAT fixture (idempotent)
        shell: pwsh
        run: |
          $root = "${{ steps.source.outputs.source_root }}"
          $program = Join-Path $root "tests\\Monarch.Core.SmokeTests\\Program.cs"
          $source = [System.IO.File]::ReadAllText($program)
          $invalidBuyerVat = '"310000000000010"'
          $validBuyerVat = '"310000000000013"'
          $invalidCount = ([regex]::Matches($source, [regex]::Escape($invalidBuyerVat))).Count
          $validCount = ([regex]::Matches($source, [regex]::Escape($validBuyerVat))).Count
          if ($invalidCount -eq 1 -and $validCount -eq 0) {
            $source = $source.Replace($invalidBuyerVat, $validBuyerVat)
            Set-Content -LiteralPath $program -Value $source -NoNewline
            Write-Host "Corrected the single known invalid VAT fixture."
          }
          elseif ($invalidCount -eq 0 -and $validCount -eq 1) {
            Write-Host "VAT fixture is already correct; no source mutation needed."
          }
          else {
            throw "VAT fixture state is ambiguous (invalid=$invalidCount, valid=$validCount); refusing a broad replacement."
          }

      - name: Validate inactive-account smoke assertion
        shell: pwsh
        run: |
          $root = "${{ steps.source.outputs.source_root }}"
          $program = Join-Path $root "tests\Monarch.Core.SmokeTests\Program.cs"
          $source = [System.IO.File]::ReadAllText($program)
          # Verify the behavior-focused assertion independent of indentation and line endings.
          $pattern = 'ExpectFailure\(\(\)\s*=>\s*\{\s*var invalidAccount\s*=\s*ledger\.CreateDraft\("JV-0007".*?ledger\.Post\(invalidAccount\.Id\);\s*\},\s*"inactive account rejected"\);'
          $matches = [regex]::Matches($source, $pattern, [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one behavior-safe inactive-account assertion; found $($matches.Count)."
          }
          Write-Host "Inactive-account rejection assertion verified; no source mutation required."

      - name: Diagnose Windows restore and Python regression failures
        if: always()
        shell: pwsh
        run: |
          $root = "${{ steps.source.outputs.source_root }}"
          $diag = Join-Path $env:RUNNER_TEMP "monarch-diagnostics"
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          $targets = @(
            "src\Monarch.Core\Backup\BackupRecoveryService.cs",
            "src\Monarch.Core\Organizations\CompanyDirectoryStore.cs",
            "src\Monarch.Core\Organizations\IdentityStore.cs",
            "tests\Monarch.Core.SmokeTests\Program.cs",
            "tests\conftest.py",
            "tests\test_backup_restore_crash_recovery_journal.py",
            "tests\test_backup_restore_failure_atomicity.py",
            "tests\test_commercial_master_data_queries.py",
            "tests\test_inventory_valuation_store.py",
            "tests\test_stock_movement_sequence.py",
            "tests\test_tenant_accounting_schema.py"
          )
          foreach ($relative in $targets) {
            $file = Join-Path $root $relative
            if (Test-Path $file) {
              "===== $relative =====" | Tee-Object -FilePath (Join-Path $diag "source-diagnostics.txt") -Append
              $lines = Get-Content -LiteralPath $file
              for ($i=0; $i -lt [Math]::Min($lines.Count, 520); $i++) {
                $line = "{0,4}: {1}" -f ($i+1), $lines[$i]
                $line | Tee-Object -FilePath (Join-Path $diag "source-diagnostics.txt") -Append
              }
            }
          }

          # Capture the actual SQLite store implementation and the tail of long journal tests.
          $storeMatches = @(Get-ChildItem -Path (Join-Path $root "src") -Recurse -File -Filter *.cs |
            Select-String -Pattern "class SqliteLedgerStore|class .*LedgerStore" |
            Select-Object -ExpandProperty Path -Unique)
          foreach ($file in $storeMatches) {
            "===== STORE IMPLEMENTATION: $file =====" | Tee-Object -FilePath (Join-Path $diag "source-diagnostics.txt") -Append
            Get-Content -LiteralPath $file | ForEach-Object -Begin { $n = 1 } -Process {
              "{0,4}: {1}" -f $n++, $_ | Tee-Object -FilePath (Join-Path $diag "source-diagnostics.txt") -Append
            }
          }

          $journalTest = Join-Path $root "tests\test_backup_restore_crash_recovery_journal.py"
          if (Test-Path $journalTest) {
            "===== JOURNAL TEST TAIL =====" | Tee-Object -FilePath (Join-Path $diag "source-diagnostics.txt") -Append
            $lines = Get-Content -LiteralPath $journalTest
            $start = [Math]::Max(0, $lines.Count - 100)
            for ($i=$start; $i -lt $lines.Count; $i++) {
              "{0,4}: {1}" -f ($i+1), $lines[$i] | Tee-Object -FilePath (Join-Path $diag "source-diagnostics.txt") -Append
            }
          }

      - name: Run .NET smoke tests
        shell: pwsh
        run: |
          $project = Join-Path "${{ steps.source.outputs.source_root }}" "tests\Monarch.Core.SmokeTests\Monarch.Core.SmokeTests.csproj"
          $diag = Join-Path $env:RUNNER_TEMP "monarch-diagnostics"
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          dotnet run --project $project --configuration Release 2>&1 | Tee-Object -FilePath (Join-Path $diag "dotnet-smoke-tests.log")
          if ($LASTEXITCODE -ne 0) { throw ".NET smoke tests failed." }

      - name: Install Python test dependencies
        if: always()
        shell: pwsh
        run: |
          $requirements = Join-Path "${{ steps.source.outputs.source_root }}" "tools\requirements.txt"
          python -m pip install --upgrade pip
          python -m pip install pytest
          if (Test-Path $requirements) { python -m pip install -r $requirements }

      - name: Run Python regression suite
        if: always()
        env:
          PYTHONUTF8: "1"
        shell: pwsh
        run: |
          $root = "${{ steps.source.outputs.source_root }}"
          Push-Location $root
          try {
            $diag = Join-Path $env:RUNNER_TEMP "monarch-diagnostics"
            New-Item -ItemType Directory -Path $diag -Force | Out-Null
            python -m pytest -q 2>&1 | Tee-Object -FilePath (Join-Path $diag "python-regression.log")
            if ($LASTEXITCODE -ne 0) { throw "Python regression suite failed." }
          }
          finally { Pop-Location }

      - name: Rebuild cumulative source archive without deleting prior files
        id: package
        if: success()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archivePath = (Resolve-Path ".\monarch-erp-net461-build-compatibility-repairs-2026-11-26.zip").Path
          $root = "${{ steps.source.outputs.source_root }}"
          $newArchive = Join-Path $env:RUNNER_TEMP "monarch-cumulative-repaired.zip"
          if (Test-Path $newArchive) { Remove-Item $newArchive -Force }

          $oldZip = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          $oldNames = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          try {
            foreach ($entry in $oldZip.Entries) {
              if (-not $entry.FullName.EndsWith("/")) { [void]$oldNames.Add($entry.FullName) }
            }
          }
          finally { $oldZip.Dispose() }

          $stream = [System.IO.File]::Open($newArchive, [System.IO.FileMode]::CreateNew)
          $zip = [System.IO.Compression.ZipArchive]::new($stream, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            $files = @(Get-ChildItem -LiteralPath $root -Recurse -File -Force | Sort-Object FullName)
            foreach ($file in $files) {
              $relative = $file.FullName.Substring($root.Length).TrimStart([char[]]@(92,47))
              $entryName = "monarch_erp_mvp/" + $relative.Replace([string][char]92, '/')
              $generatedPath = $relative -match '(^|[\\/])(bin|obj|__pycache__|\.pytest_cache|TestResults|\.vs)([\\/]|$)'
              if ($generatedPath -and -not $oldNames.Contains($entryName)) { continue }
              $entry = $zip.CreateEntry($entryName, [System.IO.Compression.CompressionLevel]::Optimal)
              $entry.LastWriteTime = [DateTimeOffset]::new(2000,1,1,0,0,0,[TimeSpan]::Zero)
              $input = [System.IO.File]::OpenRead($file.FullName)
              try {
                $output = $entry.Open()
                try { $input.CopyTo($output) } finally { $output.Dispose() }
              }
              finally { $input.Dispose() }
            }
          }
          finally { $zip.Dispose(); $stream.Dispose() }

          $newZip = [System.IO.Compression.ZipFile]::OpenRead($newArchive)
          $newNames = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          try {
            foreach ($entry in $newZip.Entries) {
              if (-not $entry.FullName.EndsWith("/")) { [void]$newNames.Add($entry.FullName) }
            }
          }
          finally { $newZip.Dispose() }

          $deleted = @($oldNames | Where-Object { -not $newNames.Contains($_) })
          $added = @($newNames | Where-Object { -not $oldNames.Contains($_) })
          if ($deleted.Count -gt 0) {
            throw "Cumulative archive guard failed. Deleted entries: $($deleted -join ', ')"
          }
          Copy-Item -LiteralPath $newArchive -Destination $archivePath -Force
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Cumulative archive preserved: old=$($oldNames.Count), new=$($newNames.Count), added=$($added.Count), deleted=0, sha256=$hash"
          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT
          "archive_sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Commit verified cumulative source archive
        if: success() && github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $branch = "${{ github.head_ref }}"
          if ([string]::IsNullOrWhiteSpace($branch)) { throw "Pull-request head branch is missing." }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "monarch-erp-net461-build-compatibility-repairs-2026-11-26.zip"
          if ($LASTEXITCODE -ne 0) { throw "Could not stage cumulative source archive." }
          git diff --cached --quiet --exit-code
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Cumulative source archive is already committed."
          }
          elseif ($LASTEXITCODE -eq 1) {
            git commit -m "Update cumulative MONARCH source archive after passing Windows validation"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit cumulative source archive." }
            git push origin "HEAD:$branch"
            if ($LASTEXITCODE -ne 0) { throw "Could not push validated cumulative source archive." }
          }
          else { throw "Could not compare staged cumulative source archive." }

      - name: Upload validated cumulative source archive
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: monarch-cumulative-source
          path: monarch-erp-net461-build-compatibility-repairs-2026-11-26.zip
          retention-days: 30

      - name: Upload Windows diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monarch-windows-diagnostics
          path: ${{ runner.temp }}/monarch-diagnostics/
          if-no-files-found: warn
          retention-days: 14
