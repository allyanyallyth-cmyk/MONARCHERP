name: MONARCH Windows Build and Tests

on:
  push:
    branches:
      - main
      - chatgpt-connection-test-20261125
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-ci:
    name: Windows, .NET and Python validation
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          python --version
          python -m pip --version

      - name: Validate ZIP archives
        id: archives
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archives = @(Get-ChildItem -Path . -Recurse -File -Filter *.zip)
          if ($archives.Count -eq 0) {
            throw "No MONARCH source archive was found in the repository."
          }

          foreach ($archive in $archives) {
            Write-Host "Checking archive: $($archive.FullName)"
            $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
            try {
              foreach ($entry in $zip.Entries) {
                if ($entry.Length -gt 0) {
                  $stream = $entry.Open()
                  try { $stream.CopyTo([System.IO.Stream]::Null) }
                  finally { $stream.Dispose() }
                }
              }
            }
            finally { $zip.Dispose() }
            Write-Host "Archive integrity OK: $($archive.Name)"
          }

          $sourceArchive = Get-Item ".\monarch-erp-net461-build-compatibility-repairs-2026-11-26.zip" -ErrorAction Stop
          "source_archive=$($sourceArchive.FullName)" >> $env:GITHUB_OUTPUT

      - name: Extract cumulative source archive
        id: source
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "monarch-source"
          if (Test-Path $destination) { Remove-Item $destination -Recurse -Force }
          New-Item -ItemType Directory -Path $destination | Out-Null
          Expand-Archive -LiteralPath "${{ steps.archives.outputs.source_archive }}" -DestinationPath $destination -Force

          $root = Join-Path $destination "monarch_erp_mvp"
          if (-not (Test-Path (Join-Path $root "MonarchERP.sln"))) {
            throw "Expected MonarchERP.sln was not found after extraction."
          }

          $required = @(
            "src\Monarch.Core\Monarch.Core.csproj",
            "src\Monarch.Desktop\Monarch.Desktop.csproj",
            "src\Monarch.Api\Monarch.Api.csproj",
            "src\Monarch.Recovery\Monarch.Recovery.csproj",
            "tests\Monarch.Core.SmokeTests\Monarch.Core.SmokeTests.csproj"
          )
          foreach ($relative in $required) {
            $candidate = Join-Path $root $relative
            if (-not (Test-Path $candidate)) { throw "Required project missing: $relative" }
            Write-Host "SOURCE OK: $relative"
          }

          $projects = @(Get-ChildItem -Path $root -Recurse -File -Filter *.csproj)
          Write-Host "Extracted C# project count: $($projects.Count)"
          "source_root=$root" >> $env:GITHUB_OUTPUT

      - name: Restore and build complete solution
        shell: pwsh
        run: |
          $solution = Join-Path "${{ steps.source.outputs.source_root }}" "MonarchERP.sln"
          dotnet restore $solution
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed." }
          dotnet build $solution --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed." }

      - name: Run .NET smoke tests
        shell: pwsh
        run: |
          $project = Join-Path "${{ steps.source.outputs.source_root }}" "tests\Monarch.Core.SmokeTests\Monarch.Core.SmokeTests.csproj"
          dotnet run --project $project --configuration Release --no-build

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          $requirements = Join-Path "${{ steps.source.outputs.source_root }}" "tools\requirements.txt"
          python -m pip install --upgrade pip
          python -m pip install pytest
          if (Test-Path $requirements) { python -m pip install -r $requirements }

      - name: Run Python regression suite
        shell: pwsh
        run: |
          $root = "${{ steps.source.outputs.source_root }}"
          Push-Location $root
          try {
            python -m pytest -q
            if ($LASTEXITCODE -ne 0) { throw "Python regression suite failed." }
          }
          finally { Pop-Location }
